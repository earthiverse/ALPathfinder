[package]
name = "alpathfinder"
version = "0.4.5"
authors = ["Kent Rasmussen <hyprkookeez@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]
required-features = ["simd"]

[dependencies]
clipper2-rust = "1.0.3"
once_cell = "1.21"
petgraph = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.145"
spade = "2.15"
wasm-bindgen = "0.2"
rustc-hash = "2.1.2"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "fat"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--precompute-propagate", "-ffm", "--signature-pruning", "--optimize-added-constants", "--low-memory-unused"]